<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inwi VIP Number - أرقام VIP موجودة الآن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a0033 50%, #0f0f23 100%);
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .phone-shape {
            width: 60px;
            height: 120px;
            border: 2px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
        }

        .sim-shape {
            width: 40px;
            height: 60px;
            border: 2px solid rgba(217, 70, 239, 0.3);
            border-radius: 4px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .grid-bg {
            background-image: 
                linear-gradient(rgba(168, 85, 247, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Robot Face */
        .robot-face {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .robot-face:hover {
            transform: scale(1.1);
        }

        .robot-eyes {
            display: flex;
            gap: 20px;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        .eye {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .pupil {
            width: 10px;
            height: 10px;
            background: #1a0033;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Sales Popup */
        .sales-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(168, 85, 247, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(217, 70, 239, 0.5);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 100;
            animation: popIn 0.5s cubic-bezier(0.36, 0, 0.66, 1);
            color: white;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .close-popup {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 24px;
            color: white;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7 0%, #d946ef 50%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fbbf24;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .hero-cta {
            background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 20px 10px;
            display: inline-block;
        }

        .hero-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(217, 70, 239, 0.4);
        }

        /* Catalog */
        .catalog {
            max-width: 1200px;
            margin: 60px auto;
            padding: 40px 20px;
        }

        .catalog h2 {
            text-align: center;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .tier {
            margin-bottom: 50px;
        }

        .tier h3 {
            font-size: 1.8rem;
            color: #fbbf24;
            margin-bottom: 20px;
            padding: 10px 0;
            border-bottom: 2px solid #d946ef;
        }

        .tier.diamond h3 { color: #60a5fa; }
        .tier.gold h3 { color: #fbbf24; }
        .tier.inwi h3 { color: #34d399; }
        .tier.silver h3 { color: #cbd5e1; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(30, 27, 75, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(168, 85, 247, 0.3);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: white;
            transition: all 0.3s;
            animation: cardSlide 0.5s ease-out forwards;
            opacity: 0;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(n+5) { animation-delay: 0.5s; }

        @keyframes cardSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(30, 27, 75, 0.95);
            border-color: #d946ef;
            box-shadow: 0 15px 40px rgba(217, 70, 239, 0.3);
        }

        .card-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .card-tier {
            font-size: 0.9rem;
            color: #a78bfa;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .card-price {
            font-size: 1.5rem;
            color: #34d399;
            font-weight: 700;
            margin: 15px 0;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px;
        }

        .whatsapp-btn:hover {
            background: #20ba5a;
            transform: scale(1.05);
        }

        /* Loading */
        .loading {
            text-align: center;
            color: #a78bfa;
            padding: 30px;
            font-size: 1.1rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #a78bfa;
            font-size: 0.9rem;
        }

        footer a {
            color: #d946ef;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            .hero-number {
                font-size: 1.8rem;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .robot-face {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-animation grid-bg"></div>
    <div class="bg-animation">
        <div class="floating-shape phone-shape" style="top: 10%; left: 5%;"></div>
        <div class="floating-shape sim-shape" style="top: 30%; right: 10%;"></div>
        <div class="floating-shape phone-shape" style="top: 60%; left: 15%;"></div>
        <div class="floating-shape sim-shape" style="bottom: 20%; right: 5%;"></div>
    </div>

    <!-- Robot Face -->
    <div class="robot-face">
        <div class="robot-eyes">
            <div class="eye">
                <div class="pupil"></div>
            </div>
            <div class="eye">
                <div class="pupil"></div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <!-- Hero -->
        <section class="hero">
            <h1>Inwi VIP Number 👑</h1>
            <p style="font-size: 1.2rem; margin-bottom: 20px; color: #a78bfa;">أرقام VIP موجودة الآن</p>
            <div class="hero-number">07 03 31 33 13</div>
            <p style="color: #fbbf24; margin-bottom: 25px; font-size: 1.1rem;">200 DH</p>
            <button class="hero-cta" onclick="orderHero()">أطلب عبر واتساب 📱</button>
        </section>

        <!-- Catalog -->
        <section class="catalog">
            <h2>كاتالوج أرقامنا</h2>
            <div id="catalog-container"></div>
        </section>

        <!-- Footer -->
        <footer>
            <p>🚀 أرقام VIP بأرخص الأسعار | جودة مضمونة</p>
            <p>📞 تواصل معنا عبر واتساب للطلبات والاستفسارات</p>
        </footer>
    </div>

    <!-- Sales Popup -->
    <div id="salesPopup" class="sales-popup" style="display: none;">
        <span class="close-popup" onclick="closePopup()">✕</span>
        <h3 style="font-size: 1.3rem; margin-bottom: 15px;">عرض سريع! ⚡</h3>
        <p id="popupName" style="font-size: 1rem; margin-bottom: 10px;"></p>
        <p id="popupNumber" style="font-size: 1.5rem; font-weight: 700; margin: 15px 0;"></p>
        <p id="popupPrice" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button class="hero-cta" onclick="orderFromPopup()" style="width: 100%;">أطلب الآن</button>
    </div>

    <script>
        // Robot eyes following mouse
        document.addEventListener('mousemove', (e) => {
            const pupils = document.querySelectorAll('.pupil');
            const robotFace = document.querySelector('.robot-face');
            const rect = robotFace.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
            pupils.forEach(pupil => {
                const x = Math.cos(angle) * 5;
                const y = Math.sin(angle) * 5;
                pupil.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            });
        });

        // Backup catalog
        const backupCatalog = {
            Diamond: [
                { number: "07 03 31 33 13", price: "200 DH", tier: "Diamond" },
                { number: "06 38 38 88 85", price: "200 DH", tier: "Diamond" },
                { number: "07 17 47 44 47", price: "200 DH", tier: "Diamond" },
                { number: "06 05 55 51 18", price: "200 DH", tier: "Diamond" },
                { number: "07 07 23 60 61", price: "200 DH", tier: "Diamond" }
            ],
            Gold: [
                { number: "06 09 39 01 07", price: "200 DH", tier: "Gold" },
                { number: "07 06 06 36 79", price: "100 DH", tier: "Gold" },
                { number: "06 04 03 89 84", price: "100 DH", tier: "Gold" },
                { number: "07 05 05 76 81", price: "100 DH", tier: "Gold" },
                { number: "07 03 22 06 00", price: "100 DH", tier: "Gold" },
                { number: "06 06 09 03 48", price: "200 DH", tier: "Gold" },
                { number: "06 07 03 13 11", price: "100 DH", tier: "Gold" },
                { number: "07 24 01 23 01", price: "100 DH", tier: "Gold" },
                { number: "07 05 11 19 13", price: "100 DH", tier: "Gold" },
                { number: "07 20 05 07 44", price: "100 DH", tier: "Gold" },
                { number: "07 05 70 74 08", price: "100 DH", tier: "Gold" },
                { number: "06 02 44 01 11", price: "100 DH", tier: "Gold" },
                { number: "06 35 38 28 35", price: "100 DH", tier: "Gold" },
                { number: "06 99 46 46 49", price: "100 DH", tier: "Gold" },
                { number: "07 10 14 44 48", price: "100 DH", tier: "Gold" },
                { number: "07 05 07 06 71", price: "200 DH", tier: "Gold" }
            ],
            Inwi: [
                { number: "06 99 99 34 38", price: "200 DH", tier: "Inwi" },
                { number: "07 11 11 67 33", price: "200 DH", tier: "Inwi" },
                { number: "07 06 88 88 18", price: "150 DH", tier: "Inwi" },
                { number: "07 06 03 33 03", price: "150 DH", tier: "Inwi" },
                { number: "06 06 96 06 07", price: "150 DH", tier: "Inwi" },
                { number: "07 13 33 37 06", price: "150 DH", tier: "Inwi" },
                { number: "07 25 37 77 70", price: "150 DH", tier: "Inwi" },
                { number: "07 04 46 66 61", price: "150 DH", tier: "Inwi" },
                { number: "06 08 78 88 82", price: "150 DH", tier: "Inwi" },
                { number: "07 22 20 23 10", price: "150 DH", tier: "Inwi" },
                { number: "07 25 24 22 29", price: "150 DH", tier: "Inwi" },
                { number: "06 04 05 05 59", price: "150 DH", tier: "Inwi" },
                { number: "06 09 91 96 27", price: "100 DH", tier: "Inwi" },
                { number: "07 05 77 97 77", price: "100 DH", tier: "Inwi" },
                { number: "06 99 22 90 94", price: "100 DH", tier: "Inwi" },
                { number: "07 00 67 08 07", price: "100 DH", tier: "Inwi" },
                { number: "07 00 50 04 53", price: "150 DH", tier: "Inwi" },
                { number: "07 25 02 22 28", price: "150 DH", tier: "Inwi" },
                { number: "07 03 85 04 03", price: "150 DH", tier: "Inwi" },
                { number: "06 06 78 09 57", price: "150 DH", tier: "Inwi" },
                { number: "07 04 05 54 59", price: "150 DH", tier: "Inwi" }
            ],
            Silver: [
                { number: "06 33 37 42 84", price: "100 DH", tier: "Silver" },
                { number: "07 03 33 81 35", price: "100 DH", tier: "Silver" },
                { number: "07 20 43 20 59", price: "100 DH", tier: "Silver" },
                { number: "07 16 34 94 44", price: "100 DH", tier: "Silver" },
                { number: "07 25 88 33 03", price: "100 DH", tier: "Silver" }
            ]
        };

        let currentCatalog = null;
        let popupNumber = null;

        // Moroccan names and cities for popup
        const moroccanNames = ['فاطمة', 'محمد', 'حسن', 'سارة', 'علي', 'خديجة', 'إبراهيم', 'مريم'];
        const moroccanCities = ['الرباط', 'فاس', 'مراكش', 'الدار البيضاء', 'تطوان', 'أكادير', 'طنجة'];

        // Load catalog
        async function loadCatalog() {
            try {
                const response = await fetch('https://vip-boti.onrender.com/api/full_catalog');
                const data = await response.json();
                currentCatalog = data;
                renderCatalog(data);
            } catch (error) {
                console.log('API failed, using backup');
                currentCatalog = backupCatalog;
                renderCatalog(backupCatalog);
            }
        }

        // Render catalog
        function renderCatalog(catalog) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            const tiers = ['Diamond', 'Gold', 'Inwi', 'Silver'];
            const tierClasses = {
                Diamond: 'diamond',
                Gold: 'gold',
                Inwi: 'inwi',
                Silver: 'silver'
            };

            tiers.forEach(tier => {
                if (catalog[tier] && catalog[tier].length > 0) {
                    const tierDiv = document.createElement('div');
                    tierDiv.className = `tier ${tierClasses[tier]}`;
                    tierDiv.innerHTML = `<h3>${tier}</h3>`;

                    const cardsGrid = document.createElement('div');
                    cardsGrid.className = 'cards-grid';

                    catalog[tier].forEach(item => {
                        if (item.status === 'available') {
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <div class="card-tier">${item.tier}</div>
                                <div class="card-number">${item.number}</div>
                                <div class="card-price">${item.price}</div>
                                <button class="whatsapp-btn" onclick="orderNumber('${item.number}')">
                                    📱 اطلب الآن
                                </button>
                            `;
                            cardsGrid.appendChild(card);
                        }
                    });

                    tierDiv.appendChild(cardsGrid);
                    container.appendChild(tierDiv);
                }
            });
        }

        // WhatsApp order
        function orderNumber(number) {
            const url = `https://wa.me/212778375026?text=${encodeURIComponent(number)}`;
            window.open(url, '_blank');
        }

        function orderHero() {
            orderNumber('07 03 31 33 13');
        }

        function orderFromPopup() {
            orderNumber(popupNumber);
            closePopup();
        }

        // Sales popup
        function showPopup() {
            const allNumbers = Object.values(currentCatalog || backupCatalog)
                .flat()
                .filter(item => item && item.status !== 'sold');
            
            if (allNumbers.length === 0) return;

            const randomItem = allNumbers[Math.floor(Math.random() * allNumbers.length)];
            const randomName = moroccanNames[Math.floor(Math.random() * moroccanNames.length)];
            const randomCity = moroccanCities[Math.floor(Math.random() * moroccanCities.length)];

            popupNumber = randomItem.number;
            document.getElementById('popupName').textContent = `${randomName} من ${randomCity}`;
            document.getElementById('popupNumber').textContent = randomItem.number;
            document.getElementById('popupPrice').textContent = randomItem.price;
            
            document.getElementById('salesPopup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('salesPopup').style.display = 'none';
        }

        // Init
        loadCatalog();
        setInterval(showPopup, 5000);
    </script>
</body>
</html>
